scenario: 满减券未达门槛被拒绝
module: order
priority: P1
tags: [negative, api, shoppro]
env: spapro
steps:
  - api:
      call: "POST /api/login"
      body: { username: "${username}", password: "${password}" }
      expect: { status: 200 }
      capture: { token: "data.token" }
  - api:
      call: "POST /api/cart/clear"
      headers: { Authorization: "Bearer ${token}" }
      expect: { status: 200 }
  - api:
      call: "POST /api/cart/add"
      headers: { Authorization: "Bearer ${token}" }
      body: { sku: "SKU-ATK-1", qty: 1 }
      expect: { status: 200 }
  - api:
      call: "POST /api/checkout"
      headers: { Authorization: "Bearer ${token}" }
      body: { coupon: "MIN200" }
      expect: { status: 422, msg: "regex: 门槛.*200" }
