scenario: 用印列表分页查询
module: seal
priority: P0
tags: [smoke]
env: xinfei
steps:
  - api:
      call: "POST /xapi/v1/xinfei/contract/seal/page"
      headers:
        Cookie: "${xf_cookie}"
        token: "${xf_token}"
      body: { page: 1, limit: 10 }
      expect: { status: 200, data.total: not_null, data.list.0.docName: not_null }
