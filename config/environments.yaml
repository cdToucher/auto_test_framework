# 正式项目：信飞诉调系统测试环境（Cookie+token 双凭证）
# 用法：登录后导出两样东西注入环境变量再跑：
#   export ATK_XF_COOKIE="token=...; orgId=..."   （完整 Cookie，9 条）
#   export ATK_XF_TOKEN="dac581dc..."             （请求头 token，32位hex）
xinfei:
  base_url: "https://xinfei-test.anmiai.com"
  trust_env: false
  vars:
    xf_cookie: "${env:ATK_XF_COOKIE}"
    xf_token: "${env:ATK_XF_TOKEN}"

# atk 自举：被测系统是 atk 自己的 Web 控制台（唯一可 HTTP 观测的自身表面）。
# 先起控制台再跑：atk console --port 8901 ；ATK_SELF_BASE_URL 由调用方注入，不落库。
atkself:
  base_url: "${env:ATK_SELF_BASE_URL}"
  vars: {}
  trust_env: false
