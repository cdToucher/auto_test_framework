[project]
name = "dev2atf"
version = "0.1.0"
description = "AI 原生双层自动化测试框架：即时层冒烟 + 沉淀层回归"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
console = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "apscheduler>=3.10"]

[project.scripts]
atk = "atk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atk*"]

[tool.setuptools.package-data]
atk = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
